<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#4158D0,#C850C0,#FFCC70,#00DBDE);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    animation:float 8s ease-in-out infinite;
    backdrop-filter:blur(5px);
}

.circle:nth-child(1){
    width:180px;
    height:180px;
    top:8%;
    left:12%;
}

.circle:nth-child(2){
    width:260px;
    height:260px;
    bottom:5%;
    right:8%;
    animation-duration:10s;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    top:65%;
    left:20%;
    animation-duration:6s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-25px);
    }
}

.container{
    width:360px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 32px rgba(0,0,0,.35);
    animation:popup .8s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:translateY(40px) scale(.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.container h1{
    color:#fff;
    text-align:center;
    margin-bottom:30px;
    letter-spacing:1px;
}

.input-group{
    margin-bottom:20px;
}

.input-group input{
    width:100%;
    padding:14px 18px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:15px;
    transition:.3s;
}

.input-group input::placeholder{
    color:#ddd;
}

.input-group input:focus{
    background:rgba(255,255,255,.25);
    transform:scale(1.03);
    box-shadow:0 0 15px rgba(255,255,255,.25);
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    color:white;
    font-size:13px;
}

.options a{
    color:#fff;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    background:white;
    color:#333;
    transition:.35s;
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(255,255,255,.4);
}

.signup{
    text-align:center;
    margin-top:18px;
    color:white;
}

.signup a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

.signup a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">
    <h1>Welcome Back</h1>

    <div class="input-group">
        <input type="text" placeholder="Username">
    </div>

    <div class="input-group">
        <input type="password" placeholder="Password">
    </div>

    <div class="options">
        <label>
            <input type="checkbox"> Remember
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <button>Login</button>

    <div class="signup">
        Don't have an account?
        <a href="#">Register</a>
    </div>
</div>

</body>
</html>
